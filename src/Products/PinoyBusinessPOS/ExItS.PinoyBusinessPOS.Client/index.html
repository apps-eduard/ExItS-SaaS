<!doctype html>
<html lang="en" data-theme="system" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#166534" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ExItS Mobile" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ExItS Mobile Client</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("exits.mobile-client.ui-preferences.v1");
          var parsed = raw ? JSON.parse(raw) : {};
          var theme =
            parsed.theme === "light" || parsed.theme === "dark" || parsed.theme === "system"
              ? parsed.theme
              : "system";
          var language = parsed.locale === "fil-PH" ? "fil-PH" : "en";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute("data-density", "comfortable");
          document.documentElement.lang = language === "fil-PH" ? "fil-PH" : "en";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "system");
          document.documentElement.setAttribute("data-density", "comfortable");
          document.documentElement.lang = "en";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
