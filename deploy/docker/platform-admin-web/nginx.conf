server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container liveness only — Platform API /health is proxied when PLATFORM_API_PROXY_TARGET is set.
    location = /nginx-health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        alias /tmp/exits-platform-admin-web-config.js;
        add_header Cache-Control "no-store";
        default_type application/javascript;
    }

    include /tmp/exits-api-proxy.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
