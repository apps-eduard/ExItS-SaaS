# ExItS production-equivalent LOCAL VALIDATION stack (P16-WP11).
#
# Same application images/code paths as Production. Only local config differs:
# host ports, connection strings, secrets, TLS off for host-run APIs, LocalValidation seed.
# Independent from exits-packaging (compose.yaml) and exits-pilot.
# Production topology template remains compose.production.yaml (TLS/proxy).
#
# Recommended daily workflow (Docker DBs only; apps run on host):
#   See README.local-validation.md and tools/Start-LocalValidation.ps1
#   docker compose -f compose.local-validation.yaml --env-file .env.local-validation up -d
#
# Optional full containerized stack (Blazor Admin 8090 + React Admin 8095 in parallel):
#   docker compose -f compose.local-validation.yaml --env-file .env.local-validation --profile apps up -d --build
#
# Default host ports (do not collide with packaging baseline):
#   admin-web 8090 · platform-api 8091 · pos-api 8092 · org-web 8093 · personal-web 8094 · admin-web-react 8095
#   platform-db 15533 · pos-db 15534
#
# Boundaries: separate Platform and POS databases; no nested clinical product tree.
# ASPNETCORE_ENVIRONMENT=Staging + LocalValidation:Enabled=true seeds approved Local Validation identities;
# operators sign in through normal /auth/login (no quick-login route).
# Do NOT use docker compose down -v — preserves local-validation DB volumes.

name: exits-local-validation

services:
  platform-db:
    container_name: exits-local-validation-platform-db
    image: postgres:16
    environment:
      POSTGRES_USER: ${LOCAL_VALIDATION_PLATFORM_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_VALIDATION_PLATFORM_DB_PASSWORD}
      POSTGRES_DB: exits_platform
    volumes:
      - exits_local_validation_platform_db_data:/var/lib/postgresql/data
    ports:
      - "${LOCAL_VALIDATION_PLATFORM_DB_HOST_PORT:-15533}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d exits_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - exits-local-validation

  pos-db:
    container_name: exits-local-validation-pos-db
    image: postgres:16
    environment:
      POSTGRES_USER: ${LOCAL_VALIDATION_POS_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_VALIDATION_POS_DB_PASSWORD}
      POSTGRES_DB: exits_pos
    volumes:
      - exits_local_validation_pos_db_data:/var/lib/postgresql/data
    ports:
      - "${LOCAL_VALIDATION_POS_DB_HOST_PORT:-15534}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d exits_pos"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - exits-local-validation

  mailpit:
    container_name: exits-local-validation-mailpit
    image: axllent/mailpit:v1.21
    ports:
      - "${LOCAL_VALIDATION_MAILPIT_UI_HOST_PORT:-8025}:8025"
      - "${LOCAL_VALIDATION_MAILPIT_SMTP_HOST_PORT:-1025}:1025"
    networks:
      - exits-local-validation

  platform-api:
    profiles: ["apps"]
    container_name: exits-local-validation-platform-api
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform-api
      args:
        EXITS_IMAGE_LABEL: p14-wp02a-local-validation
    image: exits/platform-api:${LOCAL_VALIDATION_IMAGE_TAG:-local-validation}
    depends_on:
      platform-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__PlatformDatabase: Host=platform-db;Port=5432;Database=exits_platform;Username=${LOCAL_VALIDATION_PLATFORM_DB_USER};Password=${LOCAL_VALIDATION_PLATFORM_DB_PASSWORD}
      AllowedHosts: ${LOCAL_VALIDATION_ALLOWED_HOSTS:-localhost;127.0.0.1;10.0.2.2;platform-api;admin-web;admin-web-react;pos-api;org-web;personal-web}
      Cors__AllowedOrigins__0: http://localhost:8090
      Cors__AllowedOrigins__1: http://127.0.0.1:8090
      Cors__AllowedOrigins__2: http://localhost:8093
      Cors__AllowedOrigins__3: http://127.0.0.1:8093
      Cors__AllowedOrigins__4: http://localhost:8094
      Cors__AllowedOrigins__5: http://127.0.0.1:8094
      Cors__AllowedOrigins__6: http://localhost:8095
      Cors__AllowedOrigins__7: http://127.0.0.1:8095
      Cors__AllowedOrigins__8: ${LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8090}
      Cors__AllowedOrigins__9: ${LOCAL_VALIDATION_ORG_WEB_ORIGIN:-http://localhost:8093}
      Cors__AllowedOrigins__10: ${LOCAL_VALIDATION_PERSONAL_WEB_ORIGIN:-http://localhost:8094}
      Cors__AllowedOrigins__11: ${LOCAL_VALIDATION_ADMIN_WEB_REACT_ORIGIN:-http://localhost:8095}
      Security__EnforceHttps: "false"
      LocalValidation__Enabled: "true"
      LocalValidation__SeedScope: ${LOCAL_VALIDATION_SEED_SCOPE:-PlatformAdministratorsOnly}
      LocalValidation__PurgeTransactionalOnSeed: ${LOCAL_VALIDATION_PURGE_TRANSACTIONAL:-false}
      LocalValidation__SharedPassword: ${LOCAL_VALIDATION_SHARED_PASSWORD}
      PlatformAuthentication__Password__MinimumLength: "1"
      PlatformAuthentication__Password__MaximumLength: "128"
      PlatformAuthentication__Password__RequireUppercase: "false"
      PlatformAuthentication__Password__RequireLowercase: "false"
      PlatformAuthentication__Password__RequireDigit: "false"
      PlatformAuthentication__Password__RequireNonAlphanumeric: "false"
      PlatformEmail__SmtpHost: mailpit
      PlatformEmail__SmtpPort: "1025"
      PlatformEmail__UseSsl: "false"
      PlatformEmail__FromAddress: noreply@exits.local
      PlatformEmail__FromDisplayName: ExItS Local Validation
      PlatformEmail__AdminPublicBaseUrl: ${LOCAL_VALIDATION_ADMIN_WEB_REACT_ORIGIN:-http://localhost:8095}
    ports:
      - "${LOCAL_VALIDATION_PLATFORM_API_HOST_PORT:-8091}:8080"
    networks:
      - exits-local-validation
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  pos-api:
    profiles: ["apps"]
    container_name: exits-local-validation-pos-api
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.pos-api
      args:
        EXITS_IMAGE_LABEL: p14-wp02a-local-validation
    image: exits/pos-api:${LOCAL_VALIDATION_IMAGE_TAG:-local-validation}
    depends_on:
      pos-db:
        condition: service_healthy
      platform-api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__PosDatabase: Host=pos-db;Port=5432;Database=exits_pos;Username=${LOCAL_VALIDATION_POS_DB_USER};Password=${LOCAL_VALIDATION_POS_DB_PASSWORD}
      AllowedHosts: ${LOCAL_VALIDATION_ALLOWED_HOSTS:-localhost;127.0.0.1;10.0.2.2;platform-api;admin-web;admin-web-react;pos-api;org-web;personal-web}
      Cors__AllowedOrigins__0: http://localhost:8090
      Cors__AllowedOrigins__1: http://127.0.0.1:8090
      Cors__AllowedOrigins__2: http://localhost:8093
      Cors__AllowedOrigins__3: http://127.0.0.1:8093
      Cors__AllowedOrigins__4: http://localhost:8094
      Cors__AllowedOrigins__5: http://127.0.0.1:8094
      Cors__AllowedOrigins__6: http://localhost:8095
      Cors__AllowedOrigins__7: http://127.0.0.1:8095
      Cors__AllowedOrigins__8: ${LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8090}
      Cors__AllowedOrigins__9: ${LOCAL_VALIDATION_ORG_WEB_ORIGIN:-http://localhost:8093}
      Cors__AllowedOrigins__10: ${LOCAL_VALIDATION_PERSONAL_WEB_ORIGIN:-http://localhost:8094}
      Cors__AllowedOrigins__11: ${LOCAL_VALIDATION_ADMIN_WEB_REACT_ORIGIN:-http://localhost:8095}
      Security__EnforceHttps: "false"
      LocalValidation__Enabled: "true"
      LocalValidation__PlatformApiBaseUrl: ${LOCAL_VALIDATION_PLATFORM_API_INTERNAL_URL:-http://platform-api:8080}
      PlatformAuth__BaseUrl: ${LOCAL_VALIDATION_PLATFORM_API_INTERNAL_URL:-http://platform-api:8080}
    ports:
      - "${LOCAL_VALIDATION_POS_API_HOST_PORT:-8092}:8080"
    networks:
      - exits-local-validation
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  admin-web:
    profiles: ["apps"]
    container_name: exits-local-validation-admin-web
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform-admin
    image: exits/platform-admin:${LOCAL_VALIDATION_IMAGE_TAG:-local-validation}
    depends_on:
      - platform-api
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${LOCAL_VALIDATION_ALLOWED_HOSTS:-localhost;127.0.0.1;10.0.2.2;platform-api;admin-web;admin-web-react;pos-api;org-web;personal-web}
      # Server-side Blazor HttpClient must use the Docker network hostname.
      # Browser-facing links still use LOCAL_VALIDATION_ADMIN_ORIGIN / public API ports.
      PlatformApi__BaseUrl: ${LOCAL_VALIDATION_PLATFORM_API_INTERNAL_URL:-http://platform-api:8080}
      PlatformApi__TimeoutSeconds: "30"
      LocalValidation__Enabled: "true"
      LocalValidation__SharedPassword: ${LOCAL_VALIDATION_SHARED_PASSWORD}
      ExItSWebHosts__PlatformAdmin: ${LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8090}
      ExItSWebHosts__OrganizationWeb: ${LOCAL_VALIDATION_ORG_WEB_ORIGIN:-http://localhost:8093}
      ExItSWebHosts__PersonalWeb: ${LOCAL_VALIDATION_PERSONAL_WEB_ORIGIN:-http://localhost:8094}
      DataProtection__KeysPath: /tmp/exits-admin-dp-keys
    ports:
      - "${LOCAL_VALIDATION_ADMIN_HOST_PORT:-8090}:8080"
    networks:
      - exits-local-validation
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  org-web:
    profiles: ["apps"]
    container_name: exits-local-validation-org-web
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.organization-web
    image: exits/organization-web:${LOCAL_VALIDATION_IMAGE_TAG:-local-validation}
    depends_on:
      - platform-api
      - pos-api
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${LOCAL_VALIDATION_ALLOWED_HOSTS:-localhost;127.0.0.1;10.0.2.2;platform-api;admin-web;admin-web-react;pos-api;org-web;personal-web}
      LocalValidation__Enabled: "true"
      Security__RequireHttpsApiUrls: "false"
      # Server-to-server on Compose DNS (not host PublicHost).
      PosApi__BaseUrl: ${LOCAL_VALIDATION_PLATFORM_API_INTERNAL_URL:-http://platform-api:8080}
      PosBusinessApi__BaseUrl: ${LOCAL_VALIDATION_POS_API_INTERNAL_URL:-http://pos-api:8080}
      ExItSWebHosts__PlatformAdmin: ${LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8090}
      ExItSWebHosts__OrganizationWeb: ${LOCAL_VALIDATION_ORG_WEB_ORIGIN:-http://localhost:8093}
      ExItSWebHosts__PersonalWeb: ${LOCAL_VALIDATION_PERSONAL_WEB_ORIGIN:-http://localhost:8094}
    ports:
      - "${LOCAL_VALIDATION_ORG_WEB_HOST_PORT:-8093}:8080"
    networks:
      - exits-local-validation
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  personal-web:
    profiles: ["apps"]
    container_name: exits-local-validation-personal-web
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.personal-web
    image: exits/personal-web:${LOCAL_VALIDATION_IMAGE_TAG:-local-validation}
    depends_on:
      - platform-api
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${LOCAL_VALIDATION_ALLOWED_HOSTS:-localhost;127.0.0.1;10.0.2.2;platform-api;admin-web;admin-web-react;pos-api;org-web;personal-web}
      LocalValidation__Enabled: "true"
      PlatformApi__BaseUrl: ${LOCAL_VALIDATION_PLATFORM_API_INTERNAL_URL:-http://platform-api:8080}
      ExItSWebHosts__PlatformAdmin: ${LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8090}
      ExItSWebHosts__OrganizationWeb: ${LOCAL_VALIDATION_ORG_WEB_ORIGIN:-http://localhost:8093}
      ExItSWebHosts__PersonalWeb: ${LOCAL_VALIDATION_PERSONAL_WEB_ORIGIN:-http://localhost:8094}
    ports:
      - "${LOCAL_VALIDATION_PERSONAL_WEB_HOST_PORT:-8094}:8080"
    networks:
      - exits-local-validation
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  admin-web-react:
    profiles: ["apps"]
    container_name: exits-local-validation-admin-web-react
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform-admin-web
      args:
        EXITS_GIT_SHA: ${EXITS_GIT_SHA:-unknown}
    image: exits/platform-admin-web:${LOCAL_VALIDATION_IMAGE_TAG:-local-validation}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PLATFORM_API_PUBLIC_URL: ${LOCAL_VALIDATION_PLATFORM_API_PUBLIC_URL:-}
      PLATFORM_API_SAME_ORIGIN: ${LOCAL_VALIDATION_PLATFORM_API_SAME_ORIGIN:-true}
      PLATFORM_API_PROXY_TARGET: ${LOCAL_VALIDATION_PLATFORM_API_PROXY_TARGET:-http://platform-api:8080}
      LOCAL_VALIDATION_TOOLS_ENABLED: "true"
      EXITS_GIT_SHA: ${EXITS_GIT_SHA:-unknown}
    ports:
      - "${LOCAL_VALIDATION_ADMIN_WEB_REACT_HOST_PORT:-8095}:8080"
    networks:
      - exits-local-validation
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    stop_grace_period: 10s

volumes:
  exits_local_validation_platform_db_data:
    name: exits_local_validation_platform_db_data
  exits_local_validation_pos_db_data:
    name: exits_local_validation_pos_db_data

networks:
  exits-local-validation:
    name: exits-local-validation
