# ExItS controlled pilot stack (NON-PRODUCTION).
# Do NOT describe this compose file as Production.
# Identity: set ASPNETCORE_ENVIRONMENT=Staging for APIs (no Dev/Testing headers).
# Secrets: copy ops/deploy/templates/*.env.example to a local untracked .env (never commit).
# Phase: P9-WP05-pilot-and-deployment

name: exits-pilot

services:
  platform-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PLATFORM_DB_USER}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD}
      POSTGRES_DB: exits_platform
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d exits_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - exits-pilot-internal

  pos-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POS_DB_USER}
      POSTGRES_PASSWORD: ${POS_DB_PASSWORD}
      POSTGRES_DB: exits_pos
    volumes:
      - pos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d exits_pos"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - exits-pilot-internal

  platform-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform-api
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__PlatformDatabase: Host=platform-db;Port=5432;Database=exits_platform;Username=${PLATFORM_DB_USER};Password=${PLATFORM_DB_PASSWORD}
      AllowedHosts: ${PILOT_ALLOWED_HOSTS}
      Cors__AllowedOrigins__0: ${PILOT_ADMIN_ORIGIN}
      Security__EnforceHttps: "true"
    expose:
      - "8080"
    networks:
      - exits-pilot-internal
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  pos-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.pos-api
    depends_on:
      pos-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__PosDatabase: Host=pos-db;Port=5432;Database=exits_pos;Username=${POS_DB_USER};Password=${POS_DB_PASSWORD}
      AllowedHosts: ${PILOT_ALLOWED_HOSTS}
      Cors__AllowedOrigins__0: ${PILOT_ADMIN_ORIGIN}
      Security__EnforceHttps: "true"
    expose:
      - "8080"
    networks:
      - exits-pilot-internal
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  platform-admin:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform-admin
    depends_on:
      - platform-api
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${PILOT_ALLOWED_HOSTS}
    expose:
      - "8080"
    networks:
      - exits-pilot-internal
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - platform-api
      - pos-api
      - platform-admin
    ports:
      - "${PILOT_HTTP_PORT:-8088}:80"
      - "${PILOT_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/pilot.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PILOT_TLS_CERT_DIR}:/etc/nginx/certs:ro
    networks:
      - exits-pilot-internal
      - exits-pilot-edge
    stop_grace_period: 20s

volumes:
  platform_db_data:
  pos_db_data:

networks:
  exits-pilot-internal:
    internal: true
  exits-pilot-edge:
