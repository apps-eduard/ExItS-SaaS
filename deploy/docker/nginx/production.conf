# ExItS production reverse-proxy (nginx) — P14-WP03.
# Decision: nginx (same technology as pilot NON-PRODUCTION template); production conf is separate.
# Mount TLS material from host — never commit real certificates or private keys.
#
# Limits (documented defaults):
#   client_max_body_size 1m   — align with Kestrel MaxRequestBodySize
#   proxy_connect_timeout 10s
#   proxy_send_timeout 60s
#   proxy_read_timeout 60s (Blazor circuit locations use longer read timeout)
#
# Routes:
#   /admin/     → Platform Admin (Blazor Interactive Server — WebSocket upgrade on /_blazor)
#   /platform/  → Platform API
#   /pos/       → PinoyBusinessPOS API
#
# Backends listen HTTP on the internal Docker network only.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream platform_api { server platform-api:8080; }
upstream pos_api { server pos-api:8080; }
upstream platform_admin { server platform-admin:8080; }

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # HSTS only on the HTTPS listener (enable after certificates are valid).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    location = /health {
        default_type application/json;
        return 200 '{"status":"Healthy","service":"reverse-proxy"}';
    }

    location /platform/health {
        proxy_pass http://platform_api/health;
    }

    location /platform/health/ready {
        proxy_pass http://platform_api/health/ready;
    }

    location /platform/ {
        proxy_pass http://platform_api/;
    }

    location /pos/health {
        proxy_pass http://pos_api/health;
    }

    location /pos/health/ready {
        proxy_pass http://pos_api/health/ready;
    }

    location /pos/ {
        proxy_pass http://pos_api/;
    }

    location /admin/health {
        proxy_pass http://platform_admin/health;
    }

    # Blazor Interactive Server circuit (WebSocket).
    location /admin/_blazor {
        proxy_pass http://platform_admin/_blazor;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /admin/ {
        proxy_pass http://platform_admin/;
        proxy_read_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
