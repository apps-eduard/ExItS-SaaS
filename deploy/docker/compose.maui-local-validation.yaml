# ExItS LEGACY MAUI / BLAZOR Local Validation stack (LEGACY-MAUI-ISO-01).
#
# Completely isolated from the React Local Validation stack
# (compose.local-validation.yaml / exits-local-validation / ports 8090–8095 / DB 15533–15534).
#
# Compose project: exits-maui-local-validation
# Host ports: Admin 8190 · Platform API 8191 · POS API 8192 · Org 8193 · Personal 8194
#             Platform DB 16533 · POS DB 16534 · Mailpit UI 8125 · SMTP 1125
# Databases: exits_maui_platform · exits_maui_pos
#
# Start:  .\tools\Start-MauiLegacyLocalValidation.ps1
# Stop:   .\tools\Stop-MauiLegacyLocalValidation.ps1
# Do NOT use docker compose down -v against the React stack.
# Do NOT collide with React volumes/network/project names.

name: exits-maui-local-validation

services:
  maui-platform-db:
    container_name: exits-maui-local-validation-platform-db
    image: postgres:16
    environment:
      POSTGRES_USER: ${MAUI_LOCAL_VALIDATION_PLATFORM_DB_USER}
      POSTGRES_PASSWORD: ${MAUI_LOCAL_VALIDATION_PLATFORM_DB_PASSWORD}
      POSTGRES_DB: exits_maui_platform
    volumes:
      - exits_maui_local_validation_platform_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${MAUI_LOCAL_VALIDATION_PLATFORM_DB_HOST_PORT:-16533}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d exits_maui_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - exits-maui-local-validation

  maui-pos-db:
    container_name: exits-maui-local-validation-pos-db
    image: postgres:16
    environment:
      POSTGRES_USER: ${MAUI_LOCAL_VALIDATION_POS_DB_USER}
      POSTGRES_PASSWORD: ${MAUI_LOCAL_VALIDATION_POS_DB_PASSWORD}
      POSTGRES_DB: exits_maui_pos
    volumes:
      - exits_maui_local_validation_pos_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${MAUI_LOCAL_VALIDATION_POS_DB_HOST_PORT:-16534}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d exits_maui_pos"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - exits-maui-local-validation

  maui-mailpit:
    container_name: exits-maui-local-validation-mailpit
    image: axllent/mailpit:v1.21
    ports:
      - "${MAUI_LOCAL_VALIDATION_MAILPIT_UI_HOST_PORT:-8125}:8025"
      - "${MAUI_LOCAL_VALIDATION_MAILPIT_SMTP_HOST_PORT:-1125}:1025"
    networks:
      - exits-maui-local-validation

  maui-platform-api:
    container_name: exits-maui-local-validation-platform-api
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform-api
      args:
        EXITS_IMAGE_LABEL: legacy-maui-local-validation
    image: exits/platform-api:${MAUI_LOCAL_VALIDATION_IMAGE_TAG:-maui-local-validation}
    depends_on:
      maui-platform-db:
        condition: service_healthy
      maui-mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__PlatformDatabase: Host=maui-platform-db;Port=5432;Database=exits_maui_platform;Username=${MAUI_LOCAL_VALIDATION_PLATFORM_DB_USER};Password=${MAUI_LOCAL_VALIDATION_PLATFORM_DB_PASSWORD}
      AllowedHosts: ${MAUI_LOCAL_VALIDATION_ALLOWED_HOSTS:-localhost;127.0.0.1;10.0.2.2;maui-platform-api;maui-admin-web;maui-pos-api;maui-org-web;maui-personal-web}
      Cors__AllowedOrigins__0: http://localhost:8190
      Cors__AllowedOrigins__1: http://127.0.0.1:8190
      Cors__AllowedOrigins__2: http://localhost:8193
      Cors__AllowedOrigins__3: http://127.0.0.1:8193
      Cors__AllowedOrigins__4: http://localhost:8194
      Cors__AllowedOrigins__5: http://127.0.0.1:8194
      Cors__AllowedOrigins__6: ${MAUI_LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8190}
      Cors__AllowedOrigins__7: ${MAUI_LOCAL_VALIDATION_ORG_WEB_ORIGIN:-http://localhost:8193}
      Cors__AllowedOrigins__8: ${MAUI_LOCAL_VALIDATION_PERSONAL_WEB_ORIGIN:-http://localhost:8194}
      Security__EnforceHttps: "false"
      LocalValidation__Enabled: "true"
      LocalValidation__SeedScope: ${MAUI_LOCAL_VALIDATION_SEED_SCOPE:-Full}
      LocalValidation__PurgeTransactionalOnSeed: ${MAUI_LOCAL_VALIDATION_PURGE_TRANSACTIONAL:-false}
      LocalValidation__SharedPassword: ${MAUI_LOCAL_VALIDATION_SHARED_PASSWORD}
      PlatformAuthentication__Password__MinimumLength: "1"
      PlatformAuthentication__Password__MaximumLength: "128"
      PlatformAuthentication__Password__RequireUppercase: "false"
      PlatformAuthentication__Password__RequireLowercase: "false"
      PlatformAuthentication__Password__RequireDigit: "false"
      PlatformAuthentication__Password__RequireNonAlphanumeric: "false"
      PlatformEmail__SmtpHost: maui-mailpit
      PlatformEmail__SmtpPort: "1025"
      PlatformEmail__UseSsl: "false"
      PlatformEmail__FromAddress: noreply@exits.local
      PlatformEmail__FromDisplayName: ExItS MAUI Local Validation
      PlatformEmail__AdminPublicBaseUrl: ${MAUI_LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8190}
    ports:
      - "${MAUI_LOCAL_VALIDATION_PLATFORM_API_HOST_PORT:-8191}:8080"
    networks:
      - exits-maui-local-validation
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  maui-pos-api:
    container_name: exits-maui-local-validation-pos-api
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.pos-api
      args:
        EXITS_IMAGE_LABEL: legacy-maui-local-validation
    image: exits/pos-api:${MAUI_LOCAL_VALIDATION_IMAGE_TAG:-maui-local-validation}
    depends_on:
      maui-pos-db:
        condition: service_healthy
      maui-platform-api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__PosDatabase: Host=maui-pos-db;Port=5432;Database=exits_maui_pos;Username=${MAUI_LOCAL_VALIDATION_POS_DB_USER};Password=${MAUI_LOCAL_VALIDATION_POS_DB_PASSWORD}
      AllowedHosts: ${MAUI_LOCAL_VALIDATION_ALLOWED_HOSTS:-localhost;127.0.0.1;10.0.2.2;maui-platform-api;maui-admin-web;maui-pos-api;maui-org-web;maui-personal-web}
      Cors__AllowedOrigins__0: http://localhost:8190
      Cors__AllowedOrigins__1: http://127.0.0.1:8190
      Cors__AllowedOrigins__2: http://localhost:8193
      Cors__AllowedOrigins__3: http://127.0.0.1:8193
      Cors__AllowedOrigins__4: http://localhost:8194
      Cors__AllowedOrigins__5: http://127.0.0.1:8194
      Cors__AllowedOrigins__6: ${MAUI_LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8190}
      Cors__AllowedOrigins__7: ${MAUI_LOCAL_VALIDATION_ORG_WEB_ORIGIN:-http://localhost:8193}
      Cors__AllowedOrigins__8: ${MAUI_LOCAL_VALIDATION_PERSONAL_WEB_ORIGIN:-http://localhost:8194}
      Security__EnforceHttps: "false"
      LocalValidation__Enabled: "true"
      LocalValidation__PlatformApiBaseUrl: ${MAUI_LOCAL_VALIDATION_PLATFORM_API_INTERNAL_URL:-http://maui-platform-api:8080}
      PlatformAuth__BaseUrl: ${MAUI_LOCAL_VALIDATION_PLATFORM_API_INTERNAL_URL:-http://maui-platform-api:8080}
    ports:
      - "${MAUI_LOCAL_VALIDATION_POS_API_HOST_PORT:-8192}:8080"
    networks:
      - exits-maui-local-validation
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  maui-admin-web:
    container_name: exits-maui-local-validation-admin-web
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.platform-admin
    image: exits/platform-admin:${MAUI_LOCAL_VALIDATION_IMAGE_TAG:-maui-local-validation}
    depends_on:
      - maui-platform-api
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${MAUI_LOCAL_VALIDATION_ALLOWED_HOSTS:-localhost;127.0.0.1;10.0.2.2;maui-platform-api;maui-admin-web;maui-pos-api;maui-org-web;maui-personal-web}
      PlatformApi__BaseUrl: ${MAUI_LOCAL_VALIDATION_PLATFORM_API_INTERNAL_URL:-http://maui-platform-api:8080}
      PlatformApi__TimeoutSeconds: "30"
      LocalValidation__Enabled: "true"
      LocalValidation__SharedPassword: ${MAUI_LOCAL_VALIDATION_SHARED_PASSWORD}
      ExItSWebHosts__PlatformAdmin: ${MAUI_LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8190}
      ExItSWebHosts__OrganizationWeb: ${MAUI_LOCAL_VALIDATION_ORG_WEB_ORIGIN:-http://localhost:8193}
      ExItSWebHosts__PersonalWeb: ${MAUI_LOCAL_VALIDATION_PERSONAL_WEB_ORIGIN:-http://localhost:8194}
      DataProtection__KeysPath: /tmp/exits-admin-dp-keys
    ports:
      - "${MAUI_LOCAL_VALIDATION_ADMIN_HOST_PORT:-8190}:8080"
    networks:
      - exits-maui-local-validation
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  maui-org-web:
    container_name: exits-maui-local-validation-org-web
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.organization-web
    image: exits/organization-web:${MAUI_LOCAL_VALIDATION_IMAGE_TAG:-maui-local-validation}
    depends_on:
      - maui-platform-api
      - maui-pos-api
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${MAUI_LOCAL_VALIDATION_ALLOWED_HOSTS:-localhost;127.0.0.1;10.0.2.2;maui-platform-api;maui-admin-web;maui-pos-api;maui-org-web;maui-personal-web}
      LocalValidation__Enabled: "true"
      Security__RequireHttpsApiUrls: "false"
      PosApi__BaseUrl: ${MAUI_LOCAL_VALIDATION_PLATFORM_API_INTERNAL_URL:-http://maui-platform-api:8080}
      PosBusinessApi__BaseUrl: ${MAUI_LOCAL_VALIDATION_POS_API_INTERNAL_URL:-http://maui-pos-api:8080}
      ExItSWebHosts__PlatformAdmin: ${MAUI_LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8190}
      ExItSWebHosts__OrganizationWeb: ${MAUI_LOCAL_VALIDATION_ORG_WEB_ORIGIN:-http://localhost:8193}
      ExItSWebHosts__PersonalWeb: ${MAUI_LOCAL_VALIDATION_PERSONAL_WEB_ORIGIN:-http://localhost:8194}
    ports:
      - "${MAUI_LOCAL_VALIDATION_ORG_WEB_HOST_PORT:-8193}:8080"
    networks:
      - exits-maui-local-validation
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  maui-personal-web:
    container_name: exits-maui-local-validation-personal-web
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.personal-web
    image: exits/personal-web:${MAUI_LOCAL_VALIDATION_IMAGE_TAG:-maui-local-validation}
    depends_on:
      - maui-platform-api
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${MAUI_LOCAL_VALIDATION_ALLOWED_HOSTS:-localhost;127.0.0.1;10.0.2.2;maui-platform-api;maui-admin-web;maui-pos-api;maui-org-web;maui-personal-web}
      LocalValidation__Enabled: "true"
      PlatformApi__BaseUrl: ${MAUI_LOCAL_VALIDATION_PLATFORM_API_INTERNAL_URL:-http://maui-platform-api:8080}
      ExItSWebHosts__PlatformAdmin: ${MAUI_LOCAL_VALIDATION_ADMIN_ORIGIN:-http://localhost:8190}
      ExItSWebHosts__OrganizationWeb: ${MAUI_LOCAL_VALIDATION_ORG_WEB_ORIGIN:-http://localhost:8193}
      ExItSWebHosts__PersonalWeb: ${MAUI_LOCAL_VALIDATION_PERSONAL_WEB_ORIGIN:-http://localhost:8194}
    ports:
      - "${MAUI_LOCAL_VALIDATION_PERSONAL_WEB_HOST_PORT:-8194}:8080"
    networks:
      - exits-maui-local-validation
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

volumes:
  exits_maui_local_validation_platform_db_data:
    name: exits_maui_local_validation_platform_db_data
  exits_maui_local_validation_pos_db_data:
    name: exits_maui_local_validation_pos_db_data

networks:
  exits-maui-local-validation:
    name: exits-maui-local-validation
